name: Radar de Noticias & Briefing Editorial

on:
  schedule:
    # Minutos 5 e 35: escalonado em relação ao pipeline_v2 (minutos 0 e 30)
    # para reduzir corrida de push nos mesmos arquivos de dados.
    - cron: '5,35 * * * *'
  workflow_dispatch: # Permite disparo manual no painel do GitHub

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline do Radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
        run: |
          python main.py
