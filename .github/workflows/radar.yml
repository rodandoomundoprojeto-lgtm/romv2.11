name: Radar de Noticias & Briefing Editorial

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

on:
  schedule:
    # Minutos 8 e 38: escalonado em relação ao pulso (0/30), editorial (20) e curadoria (45)
    # para evitar colisão de cota (429) e corrida nos arquivos/banco.
    - cron: '8,38 * * * *'
  workflow_dispatch: # Permite disparo manual no painel do GitHub

concurrency:
  group: rom-ia-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ping Keep-Alive Render Backend
        run: |
          curl -f -s -S --max-time 20 https://rom-backend-v2.onrender.com/health || echo "Render acordando..."

      - name: Executar Pipeline do Radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_MODEL: 'grok-2-mini'
          GROQ_MODEL: 'openai/gpt-oss-20b'
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_RADAR: ${{ secrets.DISCORD_WEBHOOK_RADAR }}
          DISCORD_WEBHOOK_CRITICO: ${{ secrets.DISCORD_WEBHOOK_CRITICO }}
          DISCORD_WEBHOOK_MANUTENCAO: ${{ secrets.DISCORD_WEBHOOK_MANUTENCAO }}
          DISCORD_PING_ON_CRITICAL: ${{ secrets.DISCORD_PING_ON_CRITICAL || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
        run: |
          python main.py

      - name: Atualizar Pilulas e Shorts do YouTube (RSS Feeder)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
        run: |
          python scripts/youtube_feeder.py || true

      - name: Sincronizar dados gerados no Git
        if: always()
        run: |
          python scripts/export_db_to_assets.py || true
          bash scripts/sync_generated_data.sh "chore(radar): atualiza feed_output, vitrine_ia e noticias_youtube" data/feed_output.json data/history.json data/vitrine_ia.json data/noticias_youtube.json
