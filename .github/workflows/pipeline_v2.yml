name: Pipeline Editorial V2 & Pulso 30m

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    # Pipeline de Pulso de Notícias Quentes (a cada 30 minutos — gemini-2.5-flash)
    - cron: '*/30 * * * *'
    # Pipeline de Curadoria e Colunas Editoriais (a cada 3 horas, minuto 20 — gemini-2.5-pro)
    # Minuto 20 evita coincidir com pulso (0/30), radar (8/38) e curadoria isolada (45).
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo do pipeline ('pulso', 'curadoria' ou 'coluna')"
        required: true
        default: 'pulso'
        type: choice
        options:
          - pulso
          - curadoria
          - coluna
      dry_run:
        description: 'Executar em modo dry-run (apenas JSON no stdout, sem gravar no banco)'
        required: false
        default: true
        type: boolean
      tema:
        description: 'Tema prioritário opcional (para o modo coluna)'
        required: false
        default: ''
        type: string

concurrency:
  group: rom-ia-pipeline-v2
  cancel-in-progress: false

jobs:
  executar-pipeline-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r curadoria/requirements.txt

      - name: Executar Pulso 30m (Agendado */30 * * * *)
        if: github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_MODEL: 'grok-2-mini'
          GROQ_MODEL: 'openai/gpt-oss-20b'
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_MANUTENCAO: ${{ secrets.DISCORD_WEBHOOK_MANUTENCAO }}
          DISCORD_WEBHOOK_CRITICO: ${{ secrets.DISCORD_WEBHOOK_CRITICO }}
          DISCORD_PING_ON_CRITICAL: ${{ secrets.DISCORD_PING_ON_CRITICAL || 'true' }}
        run: |
          python scripts/run_pipeline.py --modo pulso

      - name: Executar Curadoria & Coluna 3h (Agendado 20 */3 * * *)
        if: github.event_name == 'schedule' && github.event.schedule == '20 */3 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_MODEL: 'grok-2-mini'
          GROQ_MODEL: 'openai/gpt-oss-20b'
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_BACKEND_URL: ${{ secrets.CURADORIA_BACKEND_URL }}
          CURADORIA_SECRET_TOKEN: ${{ secrets.CURADORIA_SECRET_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_EDITORIAL: ${{ secrets.DISCORD_WEBHOOK_EDITORIAL }}
          DISCORD_WEBHOOK_CRITICO: ${{ secrets.DISCORD_WEBHOOK_CRITICO }}
          DISCORD_WEBHOOK_MANUTENCAO: ${{ secrets.DISCORD_WEBHOOK_MANUTENCAO }}
          DISCORD_PING_ON_CRITICAL: ${{ secrets.DISCORD_PING_ON_CRITICAL || 'true' }}
        run: |
          python scripts/run_pipeline.py --modo curadoria
          python scripts/run_pipeline.py --modo coluna

      - name: Executar Disparo Manual (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_MODEL: 'grok-2-mini'
          GROQ_MODEL: 'openai/gpt-oss-20b'
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_BACKEND_URL: ${{ secrets.CURADORIA_BACKEND_URL }}
          CURADORIA_SECRET_TOKEN: ${{ secrets.CURADORIA_SECRET_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_EDITORIAL: ${{ secrets.DISCORD_WEBHOOK_EDITORIAL }}
          DISCORD_WEBHOOK_CRITICO: ${{ secrets.DISCORD_WEBHOOK_CRITICO }}
          DISCORD_WEBHOOK_MANUTENCAO: ${{ secrets.DISCORD_WEBHOOK_MANUTENCAO }}
          DISCORD_PING_ON_CRITICAL: ${{ secrets.DISCORD_PING_ON_CRITICAL || 'true' }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.tema }}" ]; then
            python scripts/run_pipeline.py --modo "${{ github.event.inputs.modo }}" --tema "${{ github.event.inputs.tema }}" $DRY_FLAG
          else
            python scripts/run_pipeline.py --modo "${{ github.event.inputs.modo }}" $DRY_FLAG
          fi
