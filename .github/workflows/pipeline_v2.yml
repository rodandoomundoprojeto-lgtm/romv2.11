name: Pipeline Editorial V2 & Pulso 30m

on:
  schedule:
    # Pipeline de Pulso de Notícias Quentes (a cada 30 minutos — gemini-2.5-flash)
    - cron: '*/30 * * * *'
    # Pipeline de Curadoria e Colunas Editoriais (a cada 3 horas, minuto 10 — gemini-2.5-pro)
    # Minuto 10 evita coincidir com o pulso (*/30) e com o radar (5,35).
    - cron: '10 */3 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo do pipeline ('pulso', 'curadoria' ou 'coluna')"
        required: true
        default: 'pulso'
        type: choice
        options:
          - pulso
          - curadoria
          - coluna
      dry_run:
        description: 'Executar em modo dry-run (apenas JSON no stdout, sem gravar no banco)'
        required: false
        default: true
        type: boolean
      tema:
        description: 'Tema prioritário opcional (para o modo coluna)'
        required: false
        default: ''
        type: string

jobs:
  executar-pipeline-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r curadoria/requirements.txt

      - name: Executar Pulso 30m (Agendado */30 * * * *)
        if: github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
        run: |
          python scripts/run_pipeline.py --modo pulso

      - name: Executar Curadoria & Coluna 3h (Agendado 10 */3 * * *)
        if: github.event_name == 'schedule' && github.event.schedule == '10 */3 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_BACKEND_URL: ${{ secrets.CURADORIA_BACKEND_URL }}
          CURADORIA_SECRET_TOKEN: ${{ secrets.CURADORIA_SECRET_TOKEN }}
        run: |
          python scripts/run_pipeline.py --modo curadoria
          python scripts/run_pipeline.py --modo coluna

      - name: Executar Disparo Manual (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          CURADORIA_BACKEND_URL: ${{ secrets.CURADORIA_BACKEND_URL }}
          CURADORIA_SECRET_TOKEN: ${{ secrets.CURADORIA_SECRET_TOKEN }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.tema }}" ]; then
            python scripts/run_pipeline.py --modo "${{ github.event.inputs.modo }}" --tema "${{ github.event.inputs.tema }}" $DRY_FLAG
          else
            python scripts/run_pipeline.py --modo "${{ github.event.inputs.modo }}" $DRY_FLAG
          fi
