name: IA Juíza — Tribunal Noturno e Calibração de IAs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

on:
  schedule:
    # Executa todos os dias às 06:30 UTC (03:30 BRT da madrugada)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas simular sem persistir no banco nem disparar Discord real'
        type: boolean
        default: false

concurrency:
  group: rom-ia-juiza
  cancel-in-progress: false

jobs:
  tribunal_noturno:
    name: Sessão do Tribunal Noturno (IA Juíza)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Sessão Noturna da IA Juíza
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CURADORIA_DATABASE_URL: ${{ secrets.CURADORIA_DATABASE_URL }}
          DISCORD_WEBHOOK_JUIZA: ${{ secrets.DISCORD_WEBHOOK_JUIZA }}
          GEMINI_MODEL_JUIZA: ${{ secrets.GEMINI_MODEL_JUIZA || 'gemini-2.5-pro' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/run_pipeline.py --modo juiza --dry-run
          else
            python scripts/run_pipeline.py --modo juiza
          fi

      - name: Commit dos Snapshots Locais de Calibração
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [IA Juíza]"
          git add data/calibracoes_juiza_ativas.json data/ultimo_acordao_juiza.json || true
          git commit -m "chore(ia-juiza): atualizar calibrações e acórdão do tribunal [skip ci]" || echo "Nenhuma alteração nos snapshots"
          git push || echo "Nada para enviar"
