# Blueprint Render — Backend FastAPI do Motor V2 (painel /admin 24h)
# Uso: Render Dashboard > New > Blueprint > selecionar este repositório.
services:
  - type: web
    name: rom-backend-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CURADORIA_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: CURADORIA_SECRET_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DOSSIER_MODEL
        sync: false
