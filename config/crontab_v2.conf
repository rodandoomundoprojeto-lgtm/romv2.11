# 1. Pipeline de Pulso (Notícias Quentes — a cada 30 minutos via gemini-2.5-flash)
*/30 * * * * cd /app && python scripts/run_pipeline.py --modo pulso >> /var/log/rom_pulso.log 2>&1

# 2. Pipeline de Curadoria & Coluna Editorial (a cada 3 horas via gemini-2.5-pro)
0 */3 * * * cd /app && python scripts/run_pipeline.py --modo curadoria >> /var/log/rom_curadoria.log 2>&1 && python scripts/run_pipeline.py --modo coluna >> /var/log/rom_coluna.log 2>&1
